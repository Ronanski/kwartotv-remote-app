name: Test and Build

# Only main is built (a build that does not pass every test publishes nothing), plus a manual run:
# one run per release instead of one for the work branch and another for main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Builds of main run one after another, so two releases never get the same version number.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release-main' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    name: Version number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - id: v
        name: Next version (MAJOR.MINOR from the VERSION file, PATCH counts the releases)
        run: |
          base=$(tr -d ' \r\n' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be MAJOR.MINOR (for example 1.1), not '$base'"; exit 1; }
          last=$(git tag -l "v$base.*" | grep -E "^v${base//./\\.}\.[0-9]+$" | sed 's/.*\.//' | sort -n | tail -1 || true)
          version="$base.$(( ${last:--1} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "### KwartoTV v$version (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Version $version, build ${{ github.run_number }}"

  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet run --project tests/KwartoTV.Tests -c Release
      # The scripts KwartoTV puts in websites (TV highlight, Back, Netflix's player), in a real browser.
      - name: Website scripts in Chromium
        run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium && node tools/qa/web-nav.js && node tools/qa/netflix-row.js && node tools/qa/keyboard-page.js && node tools/qa/netflix-player.js

  windows:
    name: Windows app and installer
    needs: [core, version]
    runs-on: windows-latest
    env:
      KWARTO_VERSION: ${{ needs.version.outputs.version }}
      KWARTO_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      - name: Get libmpv (video engine)
        shell: pwsh
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./tools/get-libmpv.ps1

      - name: Publish app (self-contained, so the PC needs no .NET)
        run: dotnet publish src/KwartoTV.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.KWARTO_VERSION }} -p:FileVersion=${{ env.KWARTO_VERSION }}.${{ env.KWARTO_BUILD }} -p:AssemblyVersion=${{ env.KWARTO_VERSION }}.${{ env.KWARTO_BUILD }} -p:DebugType=None -o publish

      - name: Check libmpv is in the package
        shell: pwsh
        run: |
          if (-not (Test-Path publish/libmpv-2.dll)) { throw "libmpv-2.dll missing from publish folder" }
          Get-ChildItem publish | Measure-Object Length -Sum | ForEach-Object { "{0:N0} MB in publish" -f ($_.Sum / 1MB) }

      - name: Build installer (KwartoTV.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:KWARTO_VERSION" installer/KwartoTV.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist/KwartoTV.exe | Select-Object Name, Length

      - name: Network check script works
        shell: pwsh
        run: ./tools/check-iptv.ps1

      - name: Install silently, as a user would
        shell: pwsh
        run: |
          $p = Start-Process dist/KwartoTV.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/TASKS=""','/DIR=C:\KwartoTV-test','/LOG=install.log' -Wait -PassThru
          Get-Content install.log -Tail 25
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          if (-not (Test-Path C:\KwartoTV-test\KwartoTV.exe)) { throw "KwartoTV.exe not installed" }
          if (-not (Test-Path C:\KwartoTV-test\libmpv-2.dll)) { throw "libmpv-2.dll not installed" }
          netsh advfirewall firewall show rule name="KwartoTV remote" | Select-String "Rule Name","LocalPort","Enabled","Profiles"
          if (-not ((netsh advfirewall firewall show rule name="KwartoTV remote") -match "8765")) { throw "Firewall rule for port 8765 was not created" }
          if (-not ((netsh advfirewall firewall show rule name="KwartoTV app" verbose) -match "KwartoTV.exe")) { throw "Firewall rule for the app was not created" }
          $done = (Get-ItemProperty -Path 'HKCU:\Software\KwartoTV' -Name SetupDoneFor -ErrorAction SilentlyContinue).SetupDoneFor
          if ($done -ne 'C:\KwartoTV-test') { throw "The one-time firewall setup was not recorded ($done)" }
          Write-Host "Per-user install; one-time firewall setup recorded for $done"

      - name: Smoke test the installed app (server, discovery, screenshots)
        shell: pwsh
        run: ./tools/smoke-windows.ps1 -Exe C:\KwartoTV-test\KwartoTV.exe -OutDir qa-shots

      - name: In-app update (close, install silently, open again)
        shell: pwsh
        run: ./tools/check-update.ps1 -Exe C:\KwartoTV-test\KwartoTV.exe -Installer dist/KwartoTV.exe

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          $u = Get-ChildItem C:\KwartoTV-test -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if ((netsh advfirewall firewall show rule name="KwartoTV remote") -match "8765") { throw "Firewall rule left behind" }
          Write-Host "Uninstalled; firewall rules removed"
          exit 0   # netsh returns 1 for "no such rule", which is the expected result here

      - uses: actions/upload-artifact@v4
        with: { name: KwartoTV-installer, path: dist/KwartoTV.exe, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: qa-shots, if-no-files-found: ignore }

  android:
    name: Android remote (APK)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        env: { KWARTO_VERSION_CODE: "${{ needs.version.outputs.build }}", KWARTO_VERSION_NAME: "${{ needs.version.outputs.version }}" }
      - name: Lint
        run: ./gradlew --no-daemon lintRelease
        env: { KWARTO_VERSION_CODE: "${{ needs.version.outputs.build }}", KWARTO_VERSION_NAME: "${{ needs.version.outputs.version }}" }
      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease
        env: { KWARTO_VERSION_CODE: "${{ needs.version.outputs.build }}", KWARTO_VERSION_NAME: "${{ needs.version.outputs.version }}" }
      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/KwartoTV-Remote.apk
          ls -la ../dist
      - name: Check the APK
        run: |
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging ../dist/KwartoTV-Remote.apk | head -8
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../dist/KwartoTV-Remote.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: KwartoTV-Remote-apk, path: dist/KwartoTV-Remote.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-lint, path: android/app/build/reports/lint-results-release.html, if-no-files-found: ignore }

  release:
    name: Publish the release
    needs: [version, windows, android]
    # Only main is released (and reaches the apps' in-app updater); work branches are built and tested, not shipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Write the update manifest (used by the in-app updater of the TV app and the Android remote)
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION"
          exe_sha=$(sha256sum dist/KwartoTV.exe | cut -d' ' -f1)
          apk_sha=$(sha256sum dist/KwartoTV-Remote.apk | cut -d' ' -f1)
          cat > dist/KwartoTV-update.json <<EOF
          {
            "build": $BUILD,
            "version": "$VERSION",
            "exe": { "url": "$base/KwartoTV.exe", "sha256": "$exe_sha" },
            "apk": { "url": "$base/KwartoTV-Remote.apk", "sha256": "$apk_sha", "versionCode": $BUILD },
            "notes": "KwartoTV v$VERSION (build $BUILD, ${GITHUB_SHA::7})"
          }
          EOF
          cat dist/KwartoTV-update.json

      - name: Publish release v${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          # The old single "latest" release is replaced by one release per version.
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          files=(dist/KwartoTV.exe dist/KwartoTV-Remote.apk dist/KwartoTV-update.json)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run of the same build: replace its files.
            gh release upload "v$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest --generate-notes \
              --title "KwartoTV v$VERSION" \
              --notes "**KwartoTV v$VERSION** (build $BUILD)

          - **KwartoTV.exe**: Windows installer for the TV app
          - **KwartoTV-Remote.apk**: Android remote

          Installed apps update themselves to the newest release."
          fi
