name: Phone UI

# The phone app's UI tests alone (fast): every button, and a picture of every screen in the log.
on:
  workflow_dispatch:

jobs:
  phone-ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Phone UI tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.kwartotv.remote.ui.*'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-shots, path: android/app/build/phone-shots, if-no-files-found: ignore }
