name: Research probe

# Research only: run by hand (Actions → Research probe → Run workflow).
on:
  workflow_dispatch:

jobs:
  yt-tv-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/probe/yt-tv-search.js "$(grep -A1 'TvUserAgent =' src/KwartoTV.App/Services/WebAppWindow.cs | tail -1 | sed -E 's/^ *"(.*)";.*$/\1/')"

  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/probe/epg.js
      - run: node tools/probe/ytmusic-api.js
      - run: node tools/probe/ph-youtube-live.js

  ph-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/probe/ph-official-hls.js

  bilibili:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/probe/bilibili.js
      - run: node tools/probe/bilibili-fetch.js
      - run: node tools/probe/bilibili-api.js
      # The TV navigation script on bilibili.tv: where the highlight goes for each remote key.
      - run: node tools/probe/bilibili-tv.js probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bilibili-tv-probe, path: probe-out, if-no-files-found: ignore }
